[workspace]
members = [".", "crates/domain-probe-logo"]

[package]
name = "domain-probe"
version = "0.1.2"
edition = "2024"

[dependencies]
domain-probe-logo = { path = "crates/domain-probe-logo" }
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
hickory-resolver = "0.25"
owo-colors = { version = "4", features = ["supports-colors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
terminal_size = "0.4"
tokio-rustls = "0.26"
url = "2"
webpki-roots = "1"
x509-parser = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
